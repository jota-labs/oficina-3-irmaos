<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Ícone Esportivo: Escudo / Piston / 3 Racing -->
  <g class="logo-mark">
    <!-- Fundo do Badge / Asa de Velocidade -->
    <path d="M12 8L48 4L54 36L32 60L8 42L12 8Z" fill="#0F1217" />
    <path d="M48 4L54 36L32 60L42 28L48 4Z" fill="#E52229" opacity="0.3"/>
    
    <!-- Linhas de Corte de Velocidade -->
    <path d="M6 24L20 8M4 34L22 14M2 44L20 24" stroke="#E52229" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Numeral 3 Racing Central -->
    <text x="31" y="44" font-family="'Syncopate', 'Chakra Petch', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" font-style="italic">3</text>
    
    <!-- Ponto de luz no topo do 3 -->
    <circle cx="44" cy="14" r="3" fill="#E52229"/>
  </g>

  <!-- Tipografia da Marca -->
  <g class="logo-type" transform="translate(68, 0)">
    <!-- Linha 1: OFICINA -->
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#717D91" letter-spacing="4.5">OFICINA</text>
    
    <!-- Linha 2: 3 IRMÃOS (Com 3 em destaque Vermelho) -->
    <text x="0" y="44" font-family="'Syncopate', sans-serif" font-weight="800" font-size="20" letter-spacing="1">
      <tspan fill="#E52229">3 </tspan>
      <tspan fill="#0F1217">IRMÃOS</tspan>
    </text>
    
    <!-- Linha 3: Subtítulo de Posicionamento -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#E52229" letter-spacing="2">MOTO PEÇAS &amp; SERVIÇOS</text>
  </g>
</svg>
